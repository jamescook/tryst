# Ameba runs on its defaults for everything except the one rule below.

# spec/standalone/ holds standalone test programs, not spec files - each is
# run as its own `crystal run` process by assert_tk_subprocess (Tcl/Tk's
# interpreter is a one-shot singleton per process, so anything constructing
# its own Tryst::App needs a fresh one). They must NOT be named *_spec.cr:
# `crystal spec` globs that pattern and would try to run them in-process.
#
# Ameba's own default list already exempts spec/support/**, spec/fixtures/**
# and spec/data/** for the same reason. IgnoredPaths REPLACES that default
# rather than adding to it, so the defaults are repeated here verbatim
# alongside spec/standalone/**.
Lint/SpecFilename:
  IgnoredPaths:
    - spec/support/**
    - spec/fixtures/**
    - spec/data/**
    - spec/**/spec_helper.cr
    - spec/standalone/**

# Advisory-only, run by .githooks/pre-commit as a separate --only pass
# that never blocks the commit (the rule cannot reliably tell a wrong
# interpolation from a vetted one - see the rule's own doc comment in
# tools/ameba_rules/tcl_eval_interpolation.cr). Disabled here so the
# BLOCKING ameba pass above it in the hook ignores it; --only re-enables
# it for the advisory pass. Only exists in the custom binary built by
# tools/ameba_rules/ameba.cr - the stock ameba binary doesn't know it.
Lint/TclEvalInterpolation:
  Enabled: false
