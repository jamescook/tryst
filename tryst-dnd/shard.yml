name: tryst-dnd
version: 0.1.0

authors:
  - James Cook

crystal: ">= 1.21.0"

license: MIT

description: |
  Native OS file drag-and-drop for tryst (macOS + Linux/X11 today,
  Windows tracked separately) - makes a real drag onto a widget fire
  the <<DropFile>> event core tryst's own App#register_drop_target
  already documents. `make` builds the native static library this
  needs; consumers get it for free via the postinstall hook below -
  see README.md for the one case where it still has to be run by hand.

# Same depth as tryst-vector/tryst-sdl/the widget shards, for the same
# `shards install` reason documented in tryst-value-slider's own
# shard.yml (a transitive path: dependency has to match the literal
# relative-path string its declaring shard used).
dependencies:
  tryst:
    path: ../

# Runs `make` automatically for any CONSUMER of this shard - shards
# runs postinstall from the dependency's own install directory
# (lib/tryst-dnd in a consuming project), for every `shards
# install`/`update` that (re)installs this shard, unless
# --skip-postinstall is passed. Confirmed directly against shards'
# own source (src/commands/install.cr): postinstall only fires for
# packages resolved as dependencies, NOT for the root project shards
# is run in - so this does nothing when `shards install` is run
# inside THIS checkout (dev loop, spec suite, Docker test all still
# need their own explicit `make` first; see README.md/Dockerfile).
scripts:
  postinstall: make

# Informational (shards does not install these). See README.md for the
# real per-platform prerequisites (a C toolchain either way; libx11-dev
# on Linux; Xcode Command Line Tools on macOS).
libraries:
  x11: ">= 1.0.0" # Linux only
