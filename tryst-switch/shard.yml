name: tryst-switch
version: 0.1.0

authors:
  - James Cook

crystal: ">= 1.21.0"

license: MIT

description: |
  A Bootstrap/iOS-style animated on/off switch for tryst - rounded pill
  track, antialiased thumb with a soft shadow, ~120ms eased slide plus
  a track color crossfade on toggle. Built on Tryst::OwnerDrawnWidget
  and rendered through tryst-vector.

# tryst-vector is a repo of its own (github.com/jamescook/tryst-vector),
# not a monorepo sibling, so it's a `github:` dependency. tryst must also
# be `github:` here: shards treats a path source and a git source for the
# same shard name as ambiguous even when they resolve to the same commit.
# Local edits to tryst aren't visible here until they're pushed.
dependencies:
  tryst:
    github: jamescook/tryst
  tryst-vector:
    github: jamescook/tryst-vector

# Informational (shards does not install these) - see tryst-vector's own
# shard.yml for the per-platform package names; this shard needs exactly
# what tryst-vector needs, since it renders through the same Surface.
libraries:
  libthorvg: ">= 1.0.0"
