name: tryst-vector
version: 0.1.0

authors:
  - James Cook

crystal: ">= 1.21.0"

license: MIT

description: |
  CPU vector rasterization (ThorVG) for tryst - antialiased curves,
  gradients and shadows blitted into a Tk Photo.

# A path dependency because tryst-vector lives beside tryst in the same
# repo, the same shard-boundary philosophy as tryst-sdl: tryst itself
# gains no ThorVG dependency, and nothing here is reachable from a plain
# `require "tryst"`.
dependencies:
  tryst:
    path: ../

# Informational (shards does not install these) - the one place a
# consumer finds out what has to exist on the box before this shard will
# link. Package names differ per platform: Homebrew wants `thorvg`, apt
# wants `libthorvg-dev` (Debian forky/sid only - not yet in trixie or any
# current Ubuntu release, see the Dockerfile's own comment), MSYS2 wants
# `mingw-w64-ucrt-x86_64-thorvg`. pkg-config, which is what the build
# actually asks, calls it `thorvg-1` where it's available at all (Debian's
# package ships no .pc file - see bindings/core.cr for the fallback).
libraries:
  libthorvg: ">= 1.0.0"
