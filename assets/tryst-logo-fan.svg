<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 272 172" width="272" height="172">
  <title>tryst — platform fan</title>
  <defs>
    <linearGradient id="tb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#232E7A"/><stop offset="1" stop-color="#4B7BC4"/>
    </linearGradient>
    <clipPath id="mwin"><rect x="10" y="16" width="108" height="96" rx="10"/></clipPath>
    <clipPath id="uwin"><rect x="10" y="16" width="108" height="96" rx="9"/></clipPath>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#141824" flood-opacity="0.38"/>
    </filter>
    <g id="gem">
      <polygon points="52,52 76,52 64,72" fill="#9B82DE"/>
      <polygon points="52,52 64,72 38,72" fill="#C3B2F0"/>
      <polygon points="76,52 90,72 64,72" fill="#6C4FB8"/>
      <polygon points="38,72 64,72 64,100" fill="#6C4FB8"/>
      <polygon points="64,72 90,72 64,100" fill="#4A3390"/>
      <polygon points="46,52 48.5,58 54,60 48.5,62 46,68 43.5,62 38,60 43.5,58" fill="#FFFFFF" opacity="0.9"/>
    </g>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="136" cy="156" rx="104" ry="9" fill="#141824" opacity="0.16"/>

  <!-- left card: classic chrome, tilted out -->
  <g transform="translate(16,26) rotate(-14,64,114)" filter="url(#ds)">
    <rect x="8" y="14" width="112" height="100" fill="#2B2F3A"/>
    <rect x="10" y="16" width="108" height="96" fill="#C9CDD4"/>
    <path d="M10 112 V16 H118" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M118 16 V112 H10" fill="none" stroke="#5B6070" stroke-width="3"/>
    <rect x="15" y="21" width="98" height="15" fill="url(#tb)"/>
    <rect x="19" y="25" width="26" height="3" fill="#B9CCEE"/>
    <rect x="19" y="30" width="16" height="3" fill="#7E9AD0"/>
    <rect x="99" y="23" width="11" height="11" fill="#C9CDD4"/>
    <path d="M99 34 V23 H110" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M110 23 V34 H99" fill="none" stroke="#5B6070" stroke-width="2"/>
    <path d="M102 26 l5 5 M107 26 l-5 5" stroke="#2B2F3A" stroke-width="1.6"/>
    <rect x="15" y="38" width="98" height="70" fill="#EEF0F6"/>
    <path d="M15 108 V38 H113" fill="none" stroke="#5B6070" stroke-width="2"/>
    <path d="M113 38 V108 H15" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <use href="#gem"/>
  </g>

  <!-- right card: Ubuntu chrome, tilted out -->
  <g transform="translate(128,26) rotate(14,64,114)" filter="url(#ds)">
    <rect x="8" y="14" width="112" height="100" rx="11" fill="#1D1B22"/>
    <rect x="10" y="16" width="108" height="96" rx="9" fill="#F4F4F7"/>
    <g clip-path="url(#uwin)">
      <rect x="10" y="16" width="108" height="24" fill="#3D3846"/>
      <rect x="10" y="39" width="108" height="1.5" fill="#28242E"/>
      <rect x="18" y="25" width="24" height="3" fill="#9C93A8"/>
      <rect x="18" y="30" width="14" height="3" fill="#6E6580"/>
      <circle cx="74" cy="28" r="5.5" fill="#4F485C"/>
      <rect x="71.5" y="27.2" width="5" height="1.6" fill="#D8D4DE"/>
      <circle cx="90" cy="28" r="5.5" fill="#4F485C"/>
      <rect x="87.8" y="25.8" width="4.4" height="4.4" fill="none" stroke="#D8D4DE" stroke-width="1.2"/>
      <circle cx="106" cy="28" r="5.5" fill="#E95420"/>
      <path d="M103.8 25.8 l4.4 4.4 M108.2 25.8 l-4.4 4.4" stroke="#FFFFFF" stroke-width="1.4"/>
      <rect x="10" y="40.5" width="108" height="71.5" fill="#EEF0F6"/>
    </g>
    <use href="#gem"/>
  </g>

  <!-- front card: macOS chrome, upright -->
  <g transform="translate(72,22)" filter="url(#ds)">
    <rect x="8" y="14" width="112" height="100" rx="12" fill="#2B2F3A"/>
    <rect x="10" y="16" width="108" height="96" rx="10" fill="#F4F4F7"/>
    <g clip-path="url(#mwin)">
      <rect x="10" y="16" width="108" height="23" fill="#E8E9ED"/>
      <rect x="10" y="38" width="108" height="1.5" fill="#C6C8D0"/>
      <circle cx="24" cy="27.5" r="5" fill="#FF5F57" stroke="#E0443E" stroke-width="1"/>
      <circle cx="39" cy="27.5" r="5" fill="#FEBC2E" stroke="#DEA123" stroke-width="1"/>
      <circle cx="54" cy="27.5" r="5" fill="#28C840" stroke="#1AAB29" stroke-width="1"/>
      <rect x="10" y="39.5" width="108" height="72.5" fill="#EEF0F6"/>
    </g>
    <use href="#gem"/>
  </g>
</svg>
